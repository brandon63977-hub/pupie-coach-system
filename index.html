<index.html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUPIE S&C STUDIO ｜ 教練學生管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --ink:#171614; --paper:#FAFAF8; --steel:#6B7280; --iron:#1A1917;
  --line:#E5E1D8; --accent:#E19E15; --accent-dark:#B47E11;
  --green:#1F9D55; --green-bg:#E6F6EC; --amber:#C98A0A; --amber-bg:#FCF1DC;
  --red:#D8402C; --red-bg:#FBEAE6; --card:#FFFFFF;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
h1,h2,h3,.display{font-family:'Oswald',sans-serif;letter-spacing:.02em;text-transform:uppercase;}
.mono{font-family:'JetBrains Mono',monospace;}
#app{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--iron);color:#EFEDE8;display:flex;flex-direction:column;flex-shrink:0;}
.sidebar .brand{padding:24px 20px 16px;border-bottom:1px solid #3A3D40;}
.sidebar .brand .display{font-size:20px;color:#fff;line-height:1.2;}
.brand-logo{max-width:100%;height:auto;display:block;}
.slant{display:inline-block;transform:skewX(-8deg);}
.login-logo{max-width:220px;height:auto;display:block;margin:0 auto 18px;}
.sidebar .brand .sub{font-size:11px;color:#9A9994;margin-top:4px;letter-spacing:.08em;text-transform:uppercase;}
.nav{padding:12px;flex:1;}
.nav button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;color:#C9C7C2;padding:12px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:4px;font-family:'Inter',sans-serif;}
.nav button .dot{width:6px;height:6px;border-radius:50%;background:transparent;flex-shrink:0;}
.nav button:hover{background:#2E3134;color:#fff;}
.nav button.active{background:var(--accent);color:#fff;}
.nav button.active .dot{background:#fff;}
.sidebar .foot{padding:16px 20px;border-top:1px solid #3A3D40;}
.main{flex:1;min-width:0;padding:28px 36px 60px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.topbar h1{font-size:26px;margin:0;color:var(--ink);display:inline-block;transform:skewX(-6deg);}
.topbar .date{color:var(--steel);font-size:13px;margin-top:4px;}
.btn{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;border-radius:8px;padding:10px 18px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--steel);}
.btn-ghost{background:none;color:var(--steel);padding:6px 10px;}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-danger{background:var(--red-bg);color:var(--red);}
.cards-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
.stat-card .label{font-size:12px;color:var(--steel);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.stat-card .value{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;margin-top:6px;color:var(--ink);}
.stat-card .sub{font-size:12px;color:var(--steel);margin-top:4px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px;}
.panel h2{font-size:16px;margin:0 0 16px;color:var(--ink);}
.chart-wrap{height:260px;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:10px 10px;border-bottom:1px solid #EFEDE8;font-size:14px;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.search{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search input[type=text],.search input[type=month]{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;flex:1;min-width:160px;}
.plates{display:inline-flex;gap:3px;align-items:center;}
.plate{width:9px;height:9px;border-radius:50%;background:var(--accent);}
.plate.empty{background:#E4E0D8;}
.plate-more{font-size:11px;color:var(--steel);margin-left:2px;font-family:'JetBrains Mono',monospace;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:var(--green-bg);color:var(--green);}
.badge-amber{background:var(--amber-bg);color:var(--amber);}
.badge-red{background:var(--red-bg);color:var(--red);}
.badge-gray{background:#EFEDE8;color:var(--steel);}
.row-click{cursor:pointer;}
.row-click:hover{background:#FBFAF7;}
.empty-state{padding:40px 20px;text-align:center;color:var(--steel);font-size:14px;}
.modal-overlay{position:fixed;inset:0;background:rgba(20,19,17,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal h3{margin:0 0 18px;font-size:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--steel);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
.student-detail{display:flex;flex-direction:column;gap:16px;}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;}
.detail-head h3{margin:0;font-size:20px;}
.detail-head .meta{color:var(--steel);font-size:13px;margin-top:4px;}
.balance-box{display:flex;gap:24px;flex-wrap:wrap;}
.balance-item .n{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;}
.balance-item .l{font-size:11px;color:var(--steel);text-transform:uppercase;}
.hint{font-size:12px;color:var(--steel);margin-top:8px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:80vw;text-align:center;}
.export-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--iron);padding:20px;}
.login-card{background:#fff;border-radius:18px;padding:36px 32px;width:100%;max-width:380px;}
.login-card .display{font-size:22px;margin-bottom:2px;}
.login-card .sub{color:var(--steel);font-size:13px;margin-bottom:24px;}
.login-error{color:var(--red);font-size:12px;margin-top:8px;}
.side-icon-btn{background:none;border:none;color:#9A9994;cursor:pointer;font-size:12px;padding:6px 0;text-align:left;width:100%;font-family:'Inter',sans-serif;}
.side-icon-btn:hover{color:#fff;}
.sched-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #EFEDE8;gap:10px;flex-wrap:wrap;}
.sched-item .when{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--steel);min-width:130px;}
.todo-banner{background:var(--amber-bg);border:1px solid var(--amber);border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.range-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.sig-pad-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;}
.sig-pad-wrap canvas{width:100%;height:180px;display:block;touch-action:none;}
.sig-thumb{height:36px;border:1px solid var(--line);border-radius:6px;background:#fff;}
.salary-box{display:flex;gap:24px;flex-wrap:wrap;margin-top:14px;}
.salary-box .n{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;}
.salary-box .l{font-size:11px;color:var(--steel);text-transform:uppercase;}
@media(max-width:820px){
  .cards-row{grid-template-columns:repeat(2,1fr);}
  #app{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;align-items:center;position:sticky;top:0;z-index:50;}
  .sidebar .brand,.sidebar .foot{display:none;}
  .nav{display:flex;padding:8px;gap:4px;flex:1;overflow-x:auto;}
  .nav button{flex-direction:column;font-size:10px;padding:8px 10px;white-space:nowrap;margin-bottom:0;}
  .main{padding:18px 16px 60px;}
  .field-row{flex-direction:column;}
}
</style>
</head>

<script>
/* ---------------- 狀態 & 儲存 ---------------- */
const state = { students: [], coaches: [], purchases: [], checkins: [], schedules: [], settings: { coachPassword: '0000', sessionDurationMinutes: 60, defaultCommissionRate: 60 }, loaded: false, tab: 'dashboard' };
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDateTime = (d) => new Date(d).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const fmtDate = (d) => new Date(d).toLocaleDateString('zh-TW',{month:'2-digit',day:'2-digit'});
const fmtTime = (d) => new Date(d).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
const fmtMoney = (n) => 'NT$' + Math.round(Number(n||0)).toLocaleString('zh-TW');

const LS_PREFIX = 'coachops_v1_';
function hasClaudeStorage(){ return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function'; }
async function persistGet(key){
  if(hasClaudeStorage()){
    try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }catch(e){ /* 退回本機儲存 */ }
  }
  try{ const raw = localStorage.getItem(LS_PREFIX+key); return raw!==null ? JSON.parse(raw) : null; }catch(e){ return null; }
}
async function persistSet(key, valueObj){
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, JSON.stringify(valueObj), true); return true; }catch(e){ /* 退回本機儲存 */ }
  }
  try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(valueObj)); return true; }
  catch(e){ toast('儲存失敗，瀏覽器儲存空間可能已滿或處於隱私瀏覽模式'); return false; }
}
async function loadAll(){
  state.students = (await persistGet('students')) || [];
  state.coaches = (await persistGet('coaches')) || [];
  state.purchases = (await persistGet('purchases')) || [];
  state.checkins = (await persistGet('checkins')) || [];
  state.schedules = (await persistGet('schedules')) || [];
  state.settings = (await persistGet('settings')) || { coachPassword: '0000', sessionDurationMinutes: 60, defaultCommissionRate: 60 };
  if(state.settings.defaultCommissionRate===undefined) state.settings.defaultCommissionRate = 60;
  state.loaded = true;
}
async function saveStudents(){ await persistSet('students', state.students); }
async function saveCoaches(){ await persistSet('coaches', state.coaches); }
async function savePurchases(){ await persistSet('purchases', state.purchases); }
async function saveCheckins(){ await persistSet('checkins', state.checkins); }
async function saveSchedules(){ await persistSet('schedules', state.schedules); }
async function saveSettings(){ await persistSet('settings', state.settings); }

function toast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

/* ---------------- 衍生計算 ---------------- */
function findStudent(id){ return state.students.find(s=>s.id===id); }
function findCoach(id){ return state.coaches.find(c=>c.id===id); }
function findPurchase(id){ return state.purchases.find(p=>p.id===id); }
function calcAge(birthday){
  if(!birthday) return '';
  const b = new Date(birthday); const n = new Date();
  let age = n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth() || (n.getMonth()===b.getMonth() && n.getDate()<b.getDate())) age--;
  return age;
}
function studentStats(id){
  const purchased = state.purchases.filter(p=>p.studentId===id).reduce((a,p)=>a+Number(p.sessions),0);
  const used = state.checkins.filter(c=>c.studentId===id).length;
  return { purchased, used, remaining: purchased - used };
}
function studentSpend(id){ return state.purchases.filter(p=>p.studentId===id).reduce((a,p)=>a+Number(p.price||0),0); }
function packageUsed(purchaseId){ return state.checkins.filter(c=>c.purchaseId===purchaseId).length; }
function packageRemaining(p){ return Number(p.sessions) - packageUsed(p.id); }
// FIFO：找出該學生最早、還有剩餘堂數的購課方案
function allocatePurchase(studentId){
  const list = state.purchases.filter(p=>p.studentId===studentId).sort((a,b)=>a.purchaseDate.localeCompare(b.purchaseDate));
  for(const p of list){ if(packageRemaining(p) > 0) return p; }
  return null;
}
function getCommissionRate(purchase, coachId){
  if(purchase && purchase.commissionRateOverride!==null && purchase.commissionRateOverride!==undefined && purchase.commissionRateOverride!=='') return Number(purchase.commissionRateOverride);
  const coach = findCoach(coachId);
  if(coach && coach.defaultCommissionRate!=null) return Number(coach.defaultCommissionRate);
  return Number(state.settings.defaultCommissionRate)||0;
}

/* ---------------- 導覽 ---------------- */
const NAV = [
  {id:'dashboard', label:'儀表板'},
  {id:'students', label:'學生管理'},
  {id:'coaches', label:'教練管理'},
  {id:'checkin', label:'簽到'},
  {id:'schedule', label:'課表'},
  {id:'export', label:'匯出報表'},
];
function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV.map(n=>`<button data-tab="${n.id}" class="${state.tab===n.id?'active':''}"><span class="dot"></span>${n.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=> switchTab(b.dataset.tab)));
}
function switchTab(tab){ state.tab = tab; renderNav(); renderView(); }

/* ---------------- 視圖總入口 ---------------- */
function renderView(){
  const root = document.getElementById('views');
  if(state.tab==='dashboard') root.innerHTML = viewDashboard();
  if(state.tab==='students') root.innerHTML = viewStudents();
  if(state.tab==='coaches') root.innerHTML = viewCoaches();
  if(state.tab==='checkin') root.innerHTML = viewCheckin();
  if(state.tab==='schedule') root.innerHTML = viewSchedule();
  if(state.tab==='export') root.innerHTML = viewExport();
  attachViewHandlers();
  if(state.tab==='dashboard') drawDashboardChart();
  if(state.tab==='checkin'){ renderScheduleRosterList(); renderTodayCheckins(); renderCheckinHistory(); }
  if(state.tab==='schedule') renderScheduleList();
}

/* ---------------- 儀表板 ---------------- */
function viewDashboard(){
  const now = new Date();
  const ym = now.toISOString().slice(0,7);
  const today = todayISO();
  const monthStudents = state.students.filter(s=>s.createdAt.slice(0,7)===ym).length;
  const monthCheckins = state.checkins.filter(c=>c.timestamp.slice(0,7)===ym);
  const monthSales = state.purchases.filter(p=>p.purchaseDate.slice(0,7)===ym).reduce((a,p)=>a+Number(p.price||0),0);
  const monthEarned = monthCheckins.reduce((a,c)=>a+Number(c.unitPrice||0),0);
  const monthPayout = monthCheckins.reduce((a,c)=>a+Number(c.commissionAmount||0),0);
  const lowBalance = state.students.filter(s=>{const st=studentStats(s.id); return st.remaining<=2 && st.remaining>0;});
  const zeroBalance = state.students.filter(s=>studentStats(s.id).remaining<=0);
  const dur = Number(state.settings.sessionDurationMinutes)||60;
  const monthHours = Math.round(monthCheckins.length * dur / 60 * 10)/10;
  const todoCount = state.schedules.filter(s=>s.status==='scheduled' && new Date(s.datetime) < now).length;

  const todaySchedules = state.schedules.filter(sc=>sc.datetime.slice(0,10)===today && sc.status!=='leave' && sc.status!=='cancelled').sort((a,b)=>a.datetime.localeCompare(b.datetime));
  const todayCheckins = state.checkins.filter(c=>c.timestamp.slice(0,10)===today).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
  const todayCheckedStudentIds = new Set(todayCheckins.map(c=>c.studentId));

  return `
  <div class="topbar">
    <div><h1>儀表板</h1><div class="date">${now.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</div></div>
    <button class="btn btn-primary" id="btn-quick-add">+ 新增學生</button>
  </div>
  ${todoCount>0 ? `<div class="todo-banner"><div>有 <strong>${todoCount}</strong> 堂課已結束但尚未標記完成</div><button class="btn btn-outline btn-sm" id="btn-goto-schedule">前往處理 &rarr;</button></div>` : ''}
  <div class="cards-row">
    <div class="stat-card"><div class="label">學生總數</div><div class="value">${state.students.length}</div><div class="sub">本月新增 ${monthStudents} 人</div></div>
    <div class="stat-card"><div class="label">本月銷課堂數／時數</div><div class="value">${monthCheckins.length}</div><div class="sub">約 ${monthHours} 小時</div></div>
    <div class="stat-card"><div class="label">本月新售課程金額</div><div class="value" style="font-size:22px">${fmtMoney(monthSales)}</div><div class="sub">預收款（購課當下）</div></div>
    <div class="stat-card"><div class="label">本月已銷課產值／教練應付</div><div class="value" style="font-size:20px">${fmtMoney(monthEarned)}</div><div class="sub">教練薪資 ${fmtMoney(monthPayout)}</div></div>

let dashChartInstance = null;
let dashDayPage = 0;
function shiftDayPage(delta){ dashDayPage += delta; drawDashboardChart(); }
function drawDashboardChart(){
  const canvas = document.getElementById('dash-chart');
  if(canvas){
    const now = new Date();
    const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const ym = now.toISOString().slice(0,7);
    const perDay = {};
    state.checkins.filter(c=>c.timestamp.slice(0,7)===ym).forEach(c=>{
      const day = Number(c.timestamp.slice(8,10));
      perDay[day] = (perDay[day]||0) + 1;
    });
    const totalPages = Math.ceil(daysInMonth/5);
    if(dashDayPage < 0) dashDayPage = 0;
    if(dashDayPage > totalPages-1) dashDayPage = totalPages-1;
    const startDay = dashDayPage*5 + 1;
    const endDay = Math.min(startDay+4, daysInMonth);
    const labels = []; const counts = [];
    for(let d=startDay; d<=endDay; d++){ labels.push(d+'日'); counts.push(perDay[d]||0); }
    const label = document.getElementById('day-range-label');
    if(label) label.textContent = `${now.getMonth()+1}/${startDay} - ${now.getMonth()+1}/${endDay}`;
    const prevBtn = document.getElementById('btn-day-prev'); if(prevBtn) prevBtn.disabled = dashDayPage<=0;
    const nextBtn = document.getElementById('btn-day-next'); if(nextBtn) nextBtn.disabled = dashDayPage>=totalPages-1;
    if(dashChartInstance) dashChartInstance.destroy();
    dashChartInstance = new Chart(canvas, { type:'bar', data:{ labels, datasets:[{ data: counts, backgroundColor:'#E19E15', borderRadius:6, maxBarThickness:60 }] }, options:{ plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, ticks:{precision:0}}, x:{grid:{display:false}} } } });
  }
  renderRevenueTreemap();
}
// 簡易二分切割樹狀圖（binary slice treemap），保證矩形無重疊無空隙
function treemapLayout(items, x, y, w, h, horizontal){
  if(items.length===0) return [];
  if(items.length===1) return [{...items[0], x, y, w, h}];
  const total = items.reduce((a,i)=>a+i.value,0) || 1;
  let acc = 0, splitIdx = 1;
  for(let i=0;i<items.length;i++){ acc += items[i].value; if(acc >= total/2){ splitIdx = i+1; break; } }
  splitIdx = Math.max(1, Math.min(splitIdx, items.length-1));
  const left = items.slice(0, splitIdx), right = items.slice(splitIdx);
  const leftSum = left.reduce((a,i)=>a+i.value,0);
  const ratio = total>0 ? leftSum/total : 0.5;
  if(horizontal){
    const leftW = w*ratio;
    return [...treemapLayout(left, x, y, leftW, h, !horizontal), ...treemapLayout(right, x+leftW, y, w-leftW, h, !horizontal)];
  } else {
    const leftH = h*ratio;
    return [...treemapLayout(left, x, y, w, leftH, !horizontal), ...treemapLayout(right, x, y+leftH, w, h-leftH, !horizontal)];
  }
}
function renderRevenueTreemap(){
  const container = document.getElementById('dash-revenue-treemap');
  if(!container) return;
  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d.toISOString().slice(0,7)); }
  const data = months.map(ym => ({ ym, label: ym.slice(5)+'月', value: state.purchases.filter(p=>p.purchaseDate.slice(0,7)===ym).reduce((a,p)=>a+Number(p.price||0),0) }));
  const w = container.clientWidth || 400;
  const h = container.clientHeight || 260;
  const withEpsilon = data.map(d=>({...d, sortValue: d.value>0?d.value:1}));
  const sorted = [...withEpsilon].sort((a,b)=>b.sortValue-a.sortValue).map(d=>({...d, value:d.sortValue}));
  const rects = treemapLayout(sorted, 0, 0, w, h, true);
  const colors = ['#E19E15','#171614','#B47E11','#4A4844','#8C8880','#D8D3C4'];
  container.innerHTML = rects.map(r=>{
    const idx = sorted.findIndex(s=>s.ym===r.ym);
    const color = colors[idx % colors.length];
    const rw = Math.max(r.w-3,0), rh = Math.max(r.h-3,0);
    return `<div style="position:absolute;left:${r.x}px;top:${r.y}px;width:${rw}px;height:${rh}px;background:${color};border-radius:6px;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;overflow:hidden;padding:4px;text-align:center;">
      <div style="font-family:'Oswald',sans-serif;font-size:${rw>60?13:10}px;font-weight:600;">${r.label}</div>
      <div class="mono" style="font-size:${rw>60?12:9}px;">${fmtMoney(r.value)}</div>
    </div>`;
  }).join('');
}

function setupSignaturePad(canvas){
  canvas.width = 400; canvas.height = 180;
  const ctx = canvas.getContext('2d');
  function paintWhiteBg(){ ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,canvas.width,canvas.height); }
  paintWhiteBg();
  ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.strokeStyle = '#1A1A1A';
  let drawing = false, last = null, signed = false;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const p = e.touches && e.touches.length ? e.touches[0] : e;
    return { x: (p.clientX - r.left) * (canvas.width / r.width), y: (p.clientY - r.top) * (canvas.height / r.height) };
  }
  function start(e){ drawing = true; last = pos(e); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; signed = true; e.preventDefault(); }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  return { clear(){ paintWhiteBg(); signed = false; }, hasSigned(){ return signed; } };
}

  const rate = getCommissionRate(allocated, coachId);
  const commissionAmount = unitPrice * rate / 100;
  state.checkins.push({ id: genId(), studentId: sc.studentId, purchaseId: allocated?allocated.id:null, coachId: coachId||null, unitPrice, commissionRate: rate, commissionAmount, timestamp: new Date().toISOString(), signature, scheduleId: sc.id });

  const pad = n => String(n).padStart(2,'0');
  const toICSDate = (iso) => { const d = new Date(iso); return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z'; };
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//CoachOps//Schedule//ZH\r\n';
  upcoming.forEach(sc=>{
    const s = findStudent(sc.studentId);
    const start = new Date(sc.datetime);
    const end = new Date(start.getTime() + (Number(sc.durationMinutes)||60)*60000);
    ics += 'BEGIN:VEVENT\r\nUID:'+sc.id+'@coachops\r\nDTSTAMP:'+toICSDate(new Date().toISOString())+'\r\nDTSTART:'+toICSDate(start.toISOString())+'\r\nDTEND:'+toICSDate(end.toISOString())+'\r\nSUMMARY:訓練課程 - '+(s?s.name:'')+'\r\nDESCRIPTION:'+(sc.note||'').replace(/\n/g,' ')+'\r\nEND:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR\r\n';
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'coachops-schedule.ics'; a.click();
  toast('已匯出 .ics，可在 Google 日曆選擇「匯入」載入此檔案');
}
function requestNotifPermission(){
  if(!('Notification' in window)){ toast('此瀏覽器不支援通知功能'); return; }
  Notification.requestPermission().then(p=>{ toast(p==='granted' ? '通知已開啟' : '未取得通知權限'); });
}
function reminderTick(){
  if(!state.loaded || !('Notification' in window) || Notification.permission!=='granted') return;
  const now = new Date();
  state.schedules.forEach(sc=>{
    if(sc.status!=='scheduled' || sc.notified) return;
    const diffMin = (new Date(sc.datetime) - now)/60000;
    if(diffMin > 0 && diffMin <= 15){
      const s = findStudent(sc.studentId);
      new Notification('即將上課提醒', { body: (s?s.name:'學生')+' 約 '+Math.round(diffMin)+' 分鐘後上課' });
      sc.notified = true;
      saveSchedules();
    }
  });
}
setInterval(reminderTick, 30000);

function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(v=>{ const s = String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}

function buildReport2Rows(start, end){
  const rows = [];
  state.checkins.filter(c=>{ const d=c.timestamp.slice(0,10); return d>=start && d<=end; }).forEach(c=>{
    const s = findStudent(c.studentId); const co = findCoach(c.coachId); const p = findPurchase(c.purchaseId);
    rows.push({ time: c.timestamp, '簽到日期時間': fmtDateTime(c.timestamp), '學生姓名': s?s.name:'', '授課教練': co?co.name:'未指定', '課程方案': p?p.packageName:'', '單堂金額': Math.round(c.unitPrice), '簽到狀態': '已簽到' });

  state.schedules.filter(sc=>(sc.status==='leave'||sc.status==='cancelled') && sc.datetime.slice(0,10)>=start && sc.datetime.slice(0,10)<=end).forEach(sc=>{
    const s = findStudent(sc.studentId); const co = findCoach(sc.coachId);

  return rows;

    <div class="field-row">
      <div class="field"><label>堂數 *</label><input type="number" id="f-sessions" min="1" value="10"></div>
      <div class="field"><label>總金額 *</label><input type="number" id="f-price" min="0" value="0"></div>
    </div>
    <div class="field"><label>授課教練</label><select id="f-coach"><option value="">未指定</option>${coachOpts}</select></div>
    <div class="field"><label>抽成比例覆寫（%，留空則用教練預設）</label><input type="number" id="f-rate-override" placeholder="留空使用教練預設比例"></div>
    <div class="field-row">
      <div class="field"><label>付款狀態</label><select id="f-paystatus"><option value="已付款">已付款</option><option value="待補繳">待補繳</option></select></div>
      <div class="field"><label>付款方式</label><select id="f-paymethod"><option value="現金">現金</option><option value="轉帳">轉帳</option><option value="刷卡">刷卡</option><option value="分期">分期</option></select></div>
    </div>
    <div class="field"><label>購買日期</label><input type="date" id="f-date" value="${todayISO()}"></div>
    <div class="field-row">
      <div class="field"><label>合約起日</label><input type="date" id="f-cstart" value="${todayISO()}"></div>
      <div class="field"><label>合約迄日</label><input type="date" id="f-cend"></div>
    </div>
    <div class="field"><label>備註（退費／轉讓紀錄可寫這裡）</label><input type="text" id="f-note" placeholder="選填"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-save">新增</button>
    </div>
  `);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', async ()=>{
    const packageName = document.getElementById('f-pkg').value.trim();
    const sessions = Number(document.getElementById('f-sessions').value);
    const price = Number(document.getElementById('f-price').value)||0;
    if(!packageName || !sessions || sessions<=0){ toast('請填寫方案名稱與有效堂數'); return; }
    const rateOverrideRaw = document.getElementById('f-rate-override').value;
    state.purchases.push({ id: genId(), studentId, packageName, sessions, price, unitPrice: price/sessions, coachId: document.getElementById('f-coach').value||null, commissionRateOverride: rateOverrideRaw===''?null:Number(rateOverrideRaw), paymentStatus: document.getElementById('f-paystatus').value, paymentMethod: document.getElementById('f-paymethod').value, purchaseDate: document.getElementById('f-date').value || todayISO(), contractStart: document.getElementById('f-cstart').value, contractEnd: document.getElementById('f-cend').value, note: document.getElementById('f-note').value.trim() });
    await savePurchases();
    closeModal();
    renderView();
    toast('購課紀錄已新增');
  });
}
function openEditPurchaseModal(purchaseId){
  const p = findPurchase(purchaseId);
  if(!p) return;
  const coachOpts = state.coaches.map(c=>`<option value="${c.id}" ${p.coachId===c.id?'selected':''}>${c.name}（預設抽成${c.defaultCommissionRate}%）</option>`).join('');
  openModal(`
    <h3>編輯購課</h3>
    <div class="hint" style="margin-bottom:12px;">修改後不會影響已經簽到的歷史紀錄（單價與抽成已鎖定），只會影響尚未簽到的堂數計算。</div>
    <div class="field"><label>方案名稱 *</label><input type="text" id="f-pkg" value="${p.packageName}"></div>
    <div class="field-row">
      <div class="field"><label>堂數 *</label><input type="number" id="f-sessions" min="1" value="${p.sessions}"></div>
      <div class="field"><label>總金額 *</label><input type="number" id="f-price" min="0" value="${p.price}"></div>
    </div>
    <div class="field"><label>授課教練</label><select id="f-coach"><option value="">未指定</option>${coachOpts}</select></div>
    <div class="field"><label>抽成比例覆寫（%，留空則用教練預設）</label><input type="number" id="f-rate-override" value="${p.commissionRateOverride!=null?p.commissionRateOverride:''}" placeholder="留空使用教練預設比例"></div>
    <div class="field-row">
      <div class="field"><label>付款狀態</label><select id="f-paystatus"><option value="已付款" ${p.paymentStatus==='已付款'?'selected':''}>已付款</option><option value="待補繳" ${p.paymentStatus==='待補繳'?'selected':''}>待補繳</option></select></div>
      <div class="field"><label>付款方式</label><select id="f-paymethod"><option value="現金" ${p.paymentMethod==='現金'?'selected':''}>現金</option><option value="轉帳" ${p.paymentMethod==='轉帳'?'selected':''}>轉帳</option><option value="刷卡" ${p.paymentMethod==='刷卡'?'selected':''}>刷卡</option><option value="分期" ${p.paymentMethod==='分期'?'selected':''}>分期</option></select></div>
    </div>
    <div class="field"><label>購買日期</label><input type="date" id="f-date" value="${p.purchaseDate}"></div>
    <div class="field-row">
      <div class="field"><label>合約起日</label><input type="date" id="f-cstart" value="${p.contractStart||''}"></div>
      <div class="field"><label>合約迄日</label><input type="date" id="f-cend" value="${p.contractEnd||''}"></div>
    </div>
    <div class="field"><label>備註（退費／轉讓紀錄可寫這裡）</label><input type="text" id="f-note" value="${p.note||''}"></div>
    <div class="modal-actions" style="justify-content:space-between;">
      <button class="btn btn-danger" id="modal-delete">刪除此筆</button>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-outline" id="modal-cancel">取消</button>
        <button class="btn btn-primary" id="modal-save">儲存</button>
      </div>
    </div>
  `);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-delete').addEventListener('click', async ()=>{
    if(packageUsed(p.id) > 0){ toast('此方案已有簽到紀錄，無法刪除，可改為調整堂數或備註'); return; }
    state.purchases = state.purchases.filter(x=>x.id!==p.id);
    await savePurchases();
    closeModal(); renderView();
    toast('已刪除購課紀錄');
  });
  document.getElementById('modal-save').addEventListener('click', async ()=>{
    const packageName = document.getElementById('f-pkg').value.trim();
    const sessions = Number(document.getElementById('f-sessions').value);
    const price = Number(document.getElementById('f-price').value)||0;
    if(!packageName || !sessions || sessions<=0){ toast('請填寫方案名稱與有效堂數'); return; }
    if(sessions < packageUsed(p.id)){ toast(`此方案已簽到 ${packageUsed(p.id)} 堂，堂數不可少於這個數字`); return; }
    const rateOverrideRaw = document.getElementById('f-rate-override').value;
    p.packageName = packageName; p.sessions = sessions; p.price = price; p.unitPrice = price/sessions;
    p.coachId = document.getElementById('f-coach').value || null;
    p.commissionRateOverride = rateOverrideRaw===''?null:Number(rateOverrideRaw);
    p.paymentStatus = document.getElementById('f-paystatus').value;
    p.paymentMethod = document.getElementById('f-paymethod').value;
    p.purchaseDate = document.getElementById('f-date').value || p.purchaseDate;
    p.contractStart = document.getElementById('f-cstart').value;
    p.contractEnd = document.getElementById('f-cend').value;
    p.note = document.getElementById('f-note').value.trim();
    await savePurchases();
    closeModal(); renderView();
    toast('購課紀錄已更新');
  });
}
function openSettingsModal(){
  openModal(`
    <h3>設定</h3>
    <div class="field"><label>教練登入密碼</label><input type="text" id="f-pwd" value="${state.settings.coachPassword}"></div>
    <div class="field-row">
      <div class="field"><label>預設單堂時長（分鐘）</label><input type="number" id="f-dur" value="${state.settings.sessionDurationMinutes}"></div>
      <div class="field"><label>新教練預設抽成比例（%）</label><input type="number" id="f-rate" value="${state.settings.defaultCommissionRate}"></div>
    </div>
    <div class="hint">此比例只作為「新增教練」時的預設值，實際抽成以每位教練自己的比例、或購課時的覆寫比例為準。</div>
    <div class="hint" style="margin-top:6px;">密碼僅作畫面區隔用途，資料本身仍儲存在共用空間，請勿存放高度敏感資訊。</div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-save">儲存設定</button>
    </div>
  `);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', async ()=>{
    state.settings.coachPassword = document.getElementById('f-pwd').value.trim() || '0000';
    state.settings.sessionDurationMinutes = Number(document.getElementById('f-dur').value)||60;
    state.settings.defaultCommissionRate = Number(document.getElementById('f-rate').value)||0;
    await saveSettings();
    closeModal();
    toast('設定已更新');
  });
}

/* ---------------- 登入 ---------------- */
function doCoachLogin(){
  const pwd = document.getElementById('login-pwd').value;
  if(pwd === state.settings.coachPassword){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    state.tab = 'dashboard';
    renderNav();
    renderView();
  } else {
    document.getElementById('login-err').textContent = '密碼錯誤，請再試一次';
  }
}
function doLogout(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-pwd').value = '';
  document.getElementById('login-err').textContent = '';
}

/* ---------------- 事件綁定 ---------------- */
function attachViewHandlers(){
  const q = (sel)=>document.querySelector(sel);
  if(q('#btn-quick-add')) q('#btn-quick-add').addEventListener('click', openAddStudentModal);
  if(q('#btn-add-student')) q('#btn-add-student').addEventListener('click', openAddStudentModal);
  if(q('#student-search')) q('#student-search').addEventListener('input', (e)=>{ studentSearch = e.target.value; renderView(); });
  document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', ()=>{ openStudentId = el.dataset.open; renderView(); }));
  if(q('#btn-back-students')) q('#btn-back-students').addEventListener('click', ()=>{ openStudentId = null; renderView(); });
  if(q('#btn-edit-student')) q('#btn-edit-student').addEventListener('click', (e)=>openEditStudentModal(e.target.dataset.id));
  if(q('#btn-del-student')) q('#btn-del-student').addEventListener('click', (e)=>confirmDeleteStudent(e.target.dataset.id));
  if(q('#btn-add-purchase')) q('#btn-add-purchase').addEventListener('click', (e)=>openAddPurchaseModal(e.target.dataset.id));
  document.querySelectorAll('.btn-edit-purchase').forEach(b=>b.addEventListener('click', ()=>openEditPurchaseModal(b.dataset.id)));
  if(q('#btn-add-schedule-for-student')) q('#btn-add-schedule-for-student').addEventListener('click', (e)=>openAddScheduleModal(e.target.dataset.id));
  if(q('#btn-export-student-schedule')) q('#btn-export-student-schedule').addEventListener('click', (e)=>exportStudentScheduleExcel(e.target.dataset.id));
  if(q('#btn-add-coach')) q('#btn-add-coach').addEventListener('click', openAddCoachModal);
  document.querySelectorAll('.coach-edit-btn').forEach(b=>b.addEventListener('click', ()=>openEditCoachModal(b.dataset.id)));
  document.querySelectorAll('.coach-del-btn').forEach(b=>b.addEventListener('click', ()=>confirmDeleteCoach(b.dataset.id)));
  if(q('#checkin-hist-start')) q('#checkin-hist-start').addEventListener('change', renderCheckinHistory);
  if(q('#checkin-hist-end')) q('#checkin-hist-end').addEventListener('change', renderCheckinHistory);
  if(q('#btn-export-checkins-images')) q('#btn-export-checkins-images').addEventListener('click', exportCheckinsExcelWithSignatures);
  if(q('#btn-day-prev')) q('#btn-day-prev').addEventListener('click', ()=>shiftDayPage(-1));
  if(q('#btn-day-next')) q('#btn-day-next').addEventListener('click', ()=>shiftDayPage(1));
  if(q('#btn-export-excel')) q('#btn-export-excel').addEventListener('click', exportExcel);
  if(q('#btn-export-csv-purchases')) q('#btn-export-csv-purchases').addEventListener('click', exportPurchasesCSV);
  if(q('#btn-export-schedule-excel')) q('#btn-export-schedule-excel').addEventListener('click', exportScheduleExcelAll);
  if(q('#btn-export-1')) q('#btn-export-1').addEventListener('click', exportReport1);
  if(q('#btn-export-2')) q('#btn-export-2').addEventListener('click', exportReport2);
  if(q('#btn-export-2-csv')) q('#btn-export-2-csv').addEventListener('click', exportReport2CSV);
  if(q('#btn-export-3')) q('#btn-export-3').addEventListener('click', exportReport3);
  if(q('#btn-add-schedule')) q('#btn-add-schedule').addEventListener('click', ()=>openAddScheduleModal(null));
  if(q('#btn-enable-notif')) q('#btn-enable-notif').addEventListener('click', requestNotifPermission);
  if(q('#btn-export-ics')) q('#btn-export-ics').addEventListener('click', exportICS);
  if(q('#btn-goto-schedule')) q('#btn-goto-schedule').addEventListener('click', ()=>switchTab('schedule'));
}

/* ---------------- 啟動 ---------------- */
async function init(){
  await loadAll();
  document.getElementById('login-submit').addEventListener('click', doCoachLogin);
  document.getElementById('login-pwd').addEventListener('keydown', e=>{ if(e.key==='Enter') doCoachLogin(); });
  document.getElementById('btn-settings').addEventListener('click', openSettingsModal);
  document.getElementById('btn-logout').addEventListener('click', doLogout);
}
init();
</script>
</body>
</html>
