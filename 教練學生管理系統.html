<style>
:root{
  --ink:#171614; --paper:#FAFAF8; --steel:#6B7280; --iron:#1A1917;
  --line:#E5E1D8; --accent:#E19E15; --accent-dark:#B47E11;
  --green:#1F9D55; --green-bg:#E6F6EC; --amber:#C98A0A; --amber-bg:#FCF1DC;
  --red:#D8402C; --red-bg:#FBEAE6; --card:#FFFFFF;
}
:root[data-theme="dark"]{
  --ink:#EAEAEC; --paper:#26262A; --steel:#9C9CA3; --iron:#1E1E22;
  --line:#454549; --accent:#E19E15; --accent-dark:#F0B23A;
  --green:#3ED480; --green-bg:#1B3327; --amber:#E3B24E; --amber-bg:#3A3018;
  --red:#F2685A; --red-bg:#3A2220; --card:#313135;
}
:root[data-theme="gray"]{
  --ink:#26262A; --paper:#E2E2E6; --steel:#6B6B70; --iron:#3A3A3F;
  --line:#C6C6CB; --accent:#E19E15; --accent-dark:#B47E11;
  --green:#1F9D55; --green-bg:#DCEFE2; --amber:#C98A0A; --amber-bg:#F0E4CC;
  --red:#D8402C; --red-bg:#F0DBD6; --card:#F2F2F5;
}
:root[data-theme="dark"] body{color-scheme:dark;}
:root[data-theme="dark"] input, :root[data-theme="dark"] select, :root[data-theme="dark"] textarea,
:root[data-theme="gray"] input, :root[data-theme="gray"] select, :root[data-theme="gray"] textarea{
  background:var(--card);color:var(--ink);border-color:var(--line);
}
:root[data-theme="dark"] .btn-outline, :root[data-theme="gray"] .btn-outline{background:var(--card);}
:root[data-theme="dark"] .week-item, :root[data-theme="gray"] .week-item{background:var(--card);}
:root[data-theme="dark"] .role-toggle button, :root[data-theme="gray"] .role-toggle button{background:var(--card);color:var(--ink);}
*{box-sizing:border-box;}
html{overflow-x:hidden;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden;max-width:100vw;}
h1,h2,h3,.display{font-family:'Oswald',sans-serif;letter-spacing:.02em;text-transform:uppercase;}
.mono{font-family:'JetBrains Mono',monospace;}
#app{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--iron);color:#EFEDE8;display:flex;flex-direction:column;flex-shrink:0;}
.sidebar .brand{padding:24px 20px 16px;border-bottom:1px solid #3A3D40;}
.sidebar .brand .display{font-size:20px;color:#fff;line-height:1.2;}
.brand-logo{max-width:100%;height:auto;display:block;}
.slant{display:inline-block;transform:skewX(-8deg);}
.login-logo{max-width:220px;height:auto;display:block;margin:0 auto 18px;}
.sidebar .brand .sub{font-size:11px;color:#9A9994;margin-top:4px;letter-spacing:.08em;text-transform:uppercase;}
.nav{padding:12px;flex:1;}
.nav button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;color:#C9C7C2;padding:12px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:4px;font-family:'Inter',sans-serif;}
.nav button .nav-icon{flex-shrink:0;line-height:1;display:flex;}
.nav button .nav-icon svg{width:17px;height:17px;display:block;}
.nav button:hover{background:#2E3134;color:#fff;}
.nav button.active{background:var(--accent);color:#fff;}
.sidebar .foot{padding:16px 20px;border-top:1px solid #3A3D40;}
.main{flex:1;min-width:0;padding:28px 36px 60px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.topbar h1{font-size:26px;margin:0;color:var(--ink);display:inline-block;transform:skewX(-6deg);}
.topbar .date{color:var(--steel);font-size:13px;margin-top:4px;}
.btn{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;border-radius:8px;padding:10px 18px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--steel);}
.btn-ghost{background:none;color:var(--steel);padding:6px 10px;}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-danger{background:var(--red-bg);color:var(--red);}
.cards-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
.stat-card .label{font-size:12px;color:var(--steel);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.stat-card .value{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;margin-top:6px;color:var(--ink);}
.stat-card .sub{font-size:12px;color:var(--steel);margin-top:4px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px;min-width:0;}
.panel h2{font-size:16px;margin:0 0 16px;color:var(--ink);}
.chart-wrap{height:260px;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:10px 10px;border-bottom:1px solid #EFEDE8;font-size:14px;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.search{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search input[type=text],.search input[type=month]{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;flex:1;min-width:160px;}
.plates{display:inline-flex;gap:3px;align-items:center;}
.plate{width:9px;height:9px;border-radius:50%;background:var(--accent);}
.plate.empty{background:#E4E0D8;}
.plate-more{font-size:11px;color:var(--steel);margin-left:2px;font-family:'JetBrains Mono',monospace;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:var(--green-bg);color:var(--green);}
.badge-amber{background:var(--amber-bg);color:var(--amber);}
.badge-red{background:var(--red-bg);color:var(--red);}
.badge-gray{background:#EFEDE8;color:var(--steel);}
.row-click{cursor:pointer;}
.row-click:hover{background:#FBFAF7;}
.empty-state{padding:40px 20px;text-align:center;color:var(--steel);font-size:14px;}
.modal-overlay{position:fixed;inset:0;background:rgba(20,19,17,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal h3{margin:0 0 18px;font-size:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--steel);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
.student-detail{display:flex;flex-direction:column;gap:16px;}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;}
.detail-head h3{margin:0;font-size:20px;}
.detail-head .meta{color:var(--steel);font-size:13px;margin-top:4px;}
.balance-box{display:flex;gap:24px;flex-wrap:wrap;}
.balance-item .n{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;}
.balance-item .l{font-size:11px;color:var(--steel);text-transform:uppercase;}
.hint{font-size:12px;color:var(--steel);margin-top:8px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:80vw;text-align:center;}
.export-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--iron);padding:20px;}
.login-card{background:#fff;border-radius:18px;padding:36px 32px;width:100%;max-width:380px;}
.login-card .display{font-size:22px;margin-bottom:2px;}
.login-card .sub{color:var(--steel);font-size:13px;margin-bottom:24px;}
.login-error{color:var(--red);font-size:12px;margin-top:8px;}
.role-toggle{display:flex;gap:8px;margin-bottom:14px;}
.role-toggle button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
.role-toggle button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.side-icon-btn{background:none;border:none;color:#9A9994;cursor:pointer;font-size:12px;padding:6px 0;text-align:left;width:100%;font-family:'Inter',sans-serif;}
.side-icon-btn:hover{color:#fff;}
.sched-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #EFEDE8;gap:10px;flex-wrap:wrap;}
.week-day-col{min-width:130px;flex:1;border-right:1px solid var(--line);padding:10px 8px;}
.week-day-col:last-child{border-right:none;}
.week-day-col.is-today{background:var(--paper);}
.week-day-head{font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;margin-bottom:8px;text-align:center;color:var(--steel);letter-spacing:.03em;}
.week-day-col.is-today .week-day-head{color:var(--accent);}
.week-item{font-size:11px;padding:5px 7px;margin-bottom:5px;background:#F7F5F1;border-radius:6px;line-height:1.4;}
.week-item.is-done{background:var(--green-bg);color:var(--green);}
.sched-item .when{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--steel);min-width:130px;}
.todo-banner{background:var(--amber-bg);border:1px solid var(--amber);border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.range-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.sig-pad-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;}
.sig-pad-wrap canvas{width:100%;height:180px;display:block;touch-action:none;}
.sig-thumb{height:36px;border:1px solid var(--line);border-radius:6px;background:#fff;}
.salary-box{display:flex;gap:24px;flex-wrap:wrap;margin-top:14px;}
.salary-box .n{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;}
.salary-box .l{font-size:11px;color:var(--steel);text-transform:uppercase;}
@media(max-width:820px){
  .cards-row{grid-template-columns:repeat(2,1fr);}
  #app{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;align-items:center;position:fixed;bottom:0;left:0;right:0;top:auto;z-index:50;box-shadow:0 -2px 10px rgba(0,0,0,.15);}
  .sidebar .brand,.sidebar .foot{display:none;}
  .nav{display:flex;padding:8px 4px;gap:2px;flex:1;}
  .nav button{flex:1 1 0;min-width:0;flex-direction:column;font-size:9.5px;padding:9px 2px;white-space:nowrap;margin-bottom:0;gap:3px;border-radius:10px;}
  .nav button .nav-icon svg{width:19px;height:19px;}
  .main{padding:18px 16px 100px;}
  .field-row{flex-direction:column;}
  .dash-charts-grid{grid-template-columns:1fr !important;}
  .chart-wrap{max-width:100%;}
  canvas{max-width:100%;}
}
</style>
</head>

<script>
/* ---------------- 狀態 & 儲存 ---------------- */
const state = { students: [], coaches: [], purchases: [], checkins: [], schedules: [], packageTemplates: [], settings: { coachPassword: '0000', sessionDurationMinutes: 60, defaultCommissionRate: 60 }, loaded: false, tab: 'dashboard' };
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDateTime = (d) => new Date(d).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const fmtDate = (d) => new Date(d).toLocaleDateString('zh-TW',{month:'2-digit',day:'2-digit'});
const fmtTime = (d) => new Date(d).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
const fmtMoney = (n) => 'NT$' + Math.round(Number(n||0)).toLocaleString('zh-TW');
function checkinProofHtml(c){
  if(c.signature) return `<img class="sig-thumb" src="${c.signature}">`;
  return '<span class="badge badge-green">📷 QR 簽到</span>';
}

const LS_PREFIX = 'coachops_v1_';
// 系統管理者於此貼上「唯一一次」的 Firebase 專案設定，之後所有教練都會自動共用同一個資料庫，
// 但各自的帳號資料透過登入帳號（Email）完全獨立、互不可見。
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCMMqlCK2JghfDvqWK1RZKtE6sPZbnOVw0",
  authDomain: "pupie-coach.firebaseapp.com",
  projectId: "pupie-coach",
  storageBucket: "pupie-coach.firebasestorage.app",
  messagingSenderId: "735710150681",
  appId: "1:735710150681:web:8a2b6bf012d282a639aa88"
};
function firebaseConfigured(){ return !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('PASTE_')!==0); }
function hasClaudeStorage(){ return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function'; }
let fbDb = null, fbReady = false, fbUser = null;
const fbUnsubscribers = [];
function initFirebaseApp(){
  if(typeof firebase === 'undefined' || !firebaseConfigured()) return false;
  try{
    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.firestore();
    return true;
  }catch(e){ console.warn('Firebase 初始化失敗', e); return false; }
}
function fbDocRef(key){ return fbDb.collection('users').doc(fbUser.uid).collection('data').doc(key); }
async function persistGet(key){
  if(fbReady && fbUser){
    try{ const snap = await fbDocRef(key).get(); return snap.exists ? snap.data().value : null; }catch(e){ /* 退回本機儲存 */ }
  }
  if(hasClaudeStorage()){
    try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }catch(e){ /* 退回本機儲存 */ }
  }
  try{ const raw = localStorage.getItem(LS_PREFIX+key); return raw!==null ? JSON.parse(raw) : null; }catch(e){ return null; }
}
async function persistSet(key, valueObj){
  if(fbReady && fbUser){
    try{ await fbDocRef(key).set({ value: valueObj, updatedAt: Date.now() }); return true; }catch(e){ /* 退回本機儲存 */ }
  }
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, JSON.stringify(valueObj), true); return true; }catch(e){ /* 退回本機儲存 */ }
  }
  try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(valueObj)); return true; }
  catch(e){ toast('儲存失敗，瀏覽器儲存空間可能已滿或處於隱私瀏覽模式'); return false; }
}
const DEFAULT_SETTINGS = { coachPassword: '0000', sessionDurationMinutes: 60, defaultCommissionRate: 60 };
async function loadAll(){
  if(fbReady && fbUser){
    const keys = ['students','coaches','purchases','checkins','schedules','settings','packageTemplates'];
    const defaults = { students: [], coaches: [], purchases: [], checkins: [], schedules: [], settings: DEFAULT_SETTINGS, packageTemplates: [] };
    fbUnsubscribers.forEach(u=>{ try{ u(); }catch(e){} });
    fbUnsubscribers.length = 0;
    const lastSnapshotJSON = {};
    await Promise.all(keys.map(k => new Promise(resolve => {
      let first = true;
      const unsub = fbDocRef(k).onSnapshot(snap => {
        const newVal = snap.exists ? snap.data().value : defaults[k];
        const newJSON = JSON.stringify(newVal);
        if(lastSnapshotJSON[k] === newJSON){ if(first){ first = false; resolve(); } return; }
        lastSnapshotJSON[k] = newJSON;
        state[k] = newVal;
        if(k==='settings' && state.settings && state.settings.defaultCommissionRate===undefined) state.settings.defaultCommissionRate = 60;
        if(first){ first = false; resolve(); }
        else if(state.loaded){ renderView(); }
      }, err => { console.warn(err); if(first){ first = false; resolve(); } });
      fbUnsubscribers.push(unsub);
    })));
  } else {
    state.students = (await persistGet('students')) || [];
    state.coaches = (await persistGet('coaches')) || [];
    state.purchases = (await persistGet('purchases')) || [];
    state.checkins = (await persistGet('checkins')) || [];
    state.schedules = (await persistGet('schedules')) || [];
    state.settings = (await persistGet('settings')) || DEFAULT_SETTINGS;
    state.packageTemplates = (await persistGet('packageTemplates')) || [];
  }
  if(!state.settings) state.settings = DEFAULT_SETTINGS;
  if(state.settings.defaultCommissionRate===undefined) state.settings.defaultCommissionRate = 60;
  if(!state.packageTemplates) state.packageTemplates = [];
  state.loaded = true;
}
async function saveStudents(){ await persistSet('students', state.students); }
async function saveCoaches(){ await persistSet('coaches', state.coaches); }
async function savePurchases(){ await persistSet('purchases', state.purchases); }
async function saveCheckins(){ await persistSet('checkins', state.checkins); }
async function saveSchedules(){ await persistSet('schedules', state.schedules); }
async function saveSettings(){ await persistSet('settings', state.settings); }
async function savePackageTemplates(){ await persistSet('packageTemplates', state.packageTemplates); }

function getTheme(){ return document.documentElement.getAttribute('data-theme') || 'light'; }
function setTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem('coachops_theme', theme); }catch(e){}
}
function toast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

/* ---------------- 衍生計算 ---------------- */
function findStudent(id){ return state.students.find(s=>s.id===id); }
function getStudentQRValue(s){ return 'STUDENT:' + (s.customQRCode && s.customQRCode.trim() ? s.customQRCode.trim() : s.id); }
function findStudentByQRText(text){
  const raw = (text||'').trim();
  if(!raw) return null;
  const m = /^STUDENT:(.+)$/.exec(raw);
  const code = m ? m[1] : raw;
  return state.students.find(s => (s.customQRCode && s.customQRCode.trim()===code) || s.id===code) || null;
}
function findCoach(id){ return state.coaches.find(c=>c.id===id); }
function findPurchase(id){ return state.purchases.find(p=>p.id===id); }
/* ---------------- 表單內嵌 QR 掃描（用於掃描學生既有的 QRCode 填入自訂代碼） ---------------- */
let inlineQRScanner = null;
function startInlineQRScan(inputId){
  const area = document.getElementById('qrcode-scan-area');
  const video = document.getElementById('inline-qr-video');
  const statusEl = document.getElementById('inline-qr-status');
  if(!area || !video) return;
  area.style.display = 'block';
  if(typeof QrScanner === 'undefined'){ if(statusEl) statusEl.textContent = '掃描元件載入失敗，請檢查網路連線'; return; }
  QrScanner.WORKER_PATH = 'https://cdnjs.cloudflare.com/ajax/libs/qr-scanner/1.4.2/qr-scanner-worker.min.js';
  inlineQRScanner = new QrScanner(video, result => {
    const text = typeof result === 'string' ? result : result.data;
    const raw = (text||'').trim();
    if(!raw) return;
    const m = /^STUDENT:(.+)$/.exec(raw);
    const value = m ? m[1] : raw;
    const input = document.getElementById(inputId);
    if(input) input.value = value;
    stopInlineQRScan();
    toast('已讀取 QR 代碼');
  }, { highlightScanRegion:true, maxScansPerSecond:5 });
  inlineQRScanner.start()
    .then(()=>{ if(statusEl) statusEl.textContent = '掃描中，將 QRCode 對準畫面'; })
    .catch(()=>{ if(statusEl) statusEl.textContent = '無法開啟相機，請確認已允許相機權限'; });
}
function stopInlineQRScan(){
  if(inlineQRScanner){ try{ inlineQRScanner.stop(); inlineQRScanner.destroy(); }catch(e){} inlineQRScanner = null; }
  const area = document.getElementById('qrcode-scan-area');
  if(area) area.style.display = 'none';
}
function calcAge(birthday){
  if(!birthday) return '';
  const b = new Date(birthday); const n = new Date();
  let age = n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth() || (n.getMonth()===b.getMonth() && n.getDate()<b.getDate())) age--;
  return age;
}
function studentStats(id){
  const purchased = state.purchases.filter(p=>p.studentId===id).reduce((a,p)=>a+Number(p.sessions),0);
  const used = state.checkins.filter(c=>c.studentId===id).length;
  return { purchased, used, remaining: purchased - used };
}
function studentSpend(id){ return state.purchases.filter(p=>p.studentId===id).reduce((a,p)=>a+Number(p.price||0),0); }
function packageUsed(purchaseId){ return state.checkins.filter(c=>c.purchaseId===purchaseId).length; }
function packageRemaining(p){ return Number(p.sessions) - packageUsed(p.id); }
// FIFO：找出該學生最早、還有剩餘堂數的購課方案
function allocatePurchase(studentId){
  const list = state.purchases.filter(p=>p.studentId===studentId).sort((a,b)=>a.purchaseDate.localeCompare(b.purchaseDate));
  for(const p of list){ if(packageRemaining(p) > 0) return p; }
  return null;
}
function getCommissionRate(purchase, coachId){
  if(purchase && purchase.commissionRateOverride!==null && purchase.commissionRateOverride!==undefined && purchase.commissionRateOverride!=='') return Number(purchase.commissionRateOverride);
  const coach = findCoach(coachId);
  if(coach && coach.defaultCommissionRate!=null) return Number(coach.defaultCommissionRate);
  return Number(state.settings.defaultCommissionRate)||0;
}

function getUpcomingBirthdays(daysAhead){
  daysAhead = daysAhead===undefined ? 7 : daysAhead;
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const results = [];
  state.students.forEach(s=>{
    if(!s.birthday) return;
    const b = new Date(s.birthday);
    if(isNaN(b.getTime())) return;
    let occurrence = new Date(todayStart.getFullYear(), b.getMonth(), b.getDate());
    if(occurrence < todayStart) occurrence = new Date(todayStart.getFullYear()+1, b.getMonth(), b.getDate());
    const diffDays = Math.round((occurrence - todayStart) / 86400000);
    if(diffDays <= daysAhead){
      results.push({ student: s, occurrence, diffDays, turningAge: occurrence.getFullYear() - b.getFullYear() });
    }
  });
  results.sort((a,b)=>a.diffDays-b.diffDays);
  return results;
}

  }

// 簡易二分切割樹狀圖（binary slice treemap），保證矩形無重疊無空隙
function treemapLayout(items, x, y, w, h, horizontal){
  if(items.length===0) return [];
  if(items.length===1) return [{...items[0], x, y, w, h}];
  const total = items.reduce((a,i)=>a+i.value,0) || 1;
  let acc = 0, splitIdx = 1;
  for(let i=0;i<items.length;i++){ acc += items[i].value; if(acc >= total/2){ splitIdx = i+1; break; } }
  splitIdx = Math.max(1, Math.min(splitIdx, items.length-1));
  const left = items.slice(0, splitIdx), right = items.slice(splitIdx);
  const leftSum = left.reduce((a,i)=>a+i.value,0);
  const ratio = total>0 ? leftSum/total : 0.5;
  if(horizontal){
    const leftW = w*ratio;
    return [...treemapLayout(left, x, y, leftW, h, !horizontal), ...treemapLayout(right, x+leftW, y, w-leftW, h, !horizontal)];
  } else {
    const leftH = h*ratio;
    return [...treemapLayout(left, x, y, w, leftH, !horizontal), ...treemapLayout(right, x, y+leftH, w, h-leftH, !horizontal)];
  }
}
function renderRevenueTreemap(){
  const container = document.getElementById('dash-revenue-treemap');
  if(!container) return;
  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d.toISOString().slice(0,7)); }
  const data = months.map(ym => ({ ym, label: ym.slice(5)+'月', value: state.purchases.filter(p=>p.purchaseDate.slice(0,7)===ym).reduce((a,p)=>a+Number(p.price||0),0) }));
  const w = container.clientWidth || 400;
  const h = container.clientHeight || 260;
  const withEpsilon = data.map(d=>({...d, sortValue: d.value>0?d.value:1}));
  const sorted = [...withEpsilon].sort((a,b)=>b.sortValue-a.sortValue).map(d=>({...d, value:d.sortValue}));
  const rects = treemapLayout(sorted, 0, 0, w, h, true);
  const colors = ['#E19E15','#171614','#B47E11','#4A4844','#8C8880','#D8D3C4'];
  container.innerHTML = rects.map(r=>{
    const idx = sorted.findIndex(s=>s.ym===r.ym);
    const color = colors[idx % colors.length];
    const rw = Math.max(r.w-3,0), rh = Math.max(r.h-3,0);
    return `<div style="position:absolute;left:${r.x}px;top:${r.y}px;width:${rw}px;height:${rh}px;background:${color};border-radius:6px;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;overflow:hidden;padding:4px;text-align:center;">
      <div style="font-family:'Oswald',sans-serif;font-size:${rw>60?13:10}px;font-weight:600;">${r.label}</div>
      <div class="mono" style="font-size:${rw>60?12:9}px;">${fmtMoney(r.value)}</div>
    </div>`;
  }).join('');
}

let qrScannerInstance = null;
let lastQRScan = 0;
function openQRScanModal(){
  openModal(`
    <h3>QR 掃描簽到</h3>
    <div class="hint" style="margin-bottom:10px;">請將學生的專屬 QRCode 對準鏡頭</div>

    <div id="qr-scan-status" class="hint" style="margin-top:10px;">正在啟動相機...</div>
    <div class="modal-actions"><button class="btn btn-outline" id="modal-cancel">取消</button></div>
  `);
  document.getElementById('modal-cancel').addEventListener('click', ()=>{ stopQRScanner(); closeModal(); });
  startQRScanner();
}
function startQRScanner(){
  const video = document.getElementById('qr-video');
  const statusEl = document.getElementById('qr-scan-status');
  if(typeof QrScanner === 'undefined'){ if(statusEl) statusEl.textContent = '掃描元件載入失敗，請改用手寫簽到'; return; }
  QrScanner.WORKER_PATH = 'https://cdnjs.cloudflare.com/ajax/libs/qr-scanner/1.4.2/qr-scanner-worker.min.js';
  qrScannerInstance = new QrScanner(video, result => {
    const text = typeof result === 'string' ? result : result.data;
    handleQRDecoded(text);
  }, { highlightScanRegion:true, highlightCodeOutline:true, maxScansPerSecond:5 });
  qrScannerInstance.start()
    .then(()=>{ if(statusEl) statusEl.textContent = '掃描中，將 QRCode 對準畫面即可'; })
    .catch(()=>{ if(statusEl) statusEl.textContent = '無法開啟相機，請確認已允許相機權限，或改用手寫簽到'; });
}
function stopQRScanner(){
  if(qrScannerInstance){ try{ qrScannerInstance.stop(); qrScannerInstance.destroy(); }catch(e){} qrScannerInstance = null; }
}
function handleQRDecoded(text){
  const now = Date.now();
  if(now - lastQRScan < 2000) return;
  lastQRScan = now;
  const statusEl = document.getElementById('qr-scan-status');
  const s = findStudentByQRText(text);
  if(!s){ if(statusEl) statusEl.textContent = '無法辨識，請確認是本系統產生的學生 QRCode'; return; }
  const sc = todaysScheduleItems().find(x=>x.studentId===s.id && x.status!=='completed');
  if(!sc){ if(statusEl) statusEl.textContent = `${s.name} 今天沒有排課，或已完成簽到`; return; }
  stopQRScanner();
  openQRCheckinConfirmModal(sc);
}

function setupSignaturePad(canvas){
  canvas.width = 400; canvas.height = 180;
  const ctx = canvas.getContext('2d');
  function paintWhiteBg(){ ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,canvas.width,canvas.height); }
  paintWhiteBg();
  ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.strokeStyle = '#1A1A1A';
  let drawing = false, last = null, signed = false;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const p = e.touches && e.touches.length ? e.touches[0] : e;
    return { x: (p.clientX - r.left) * (canvas.width / r.width), y: (p.clientY - r.top) * (canvas.height / r.height) };
  }
  function start(e){ drawing = true; last = pos(e); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; signed = true; e.preventDefault(); }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  return { clear(){ paintWhiteBg(); signed = false; }, hasSigned(){ return signed; } };
}

function kindForSchedule(sc){
  if(sc.status==='completed') return 'done';
  if(sc.status==='leave' || sc.status==='cancelled') return 'leavecancel';
  return new Date(sc.datetime) < new Date() ? 'overdue' : 'upcoming';
}
let weekOffset = 0;
function getWeekDates(offset){
  const now = new Date();
  const day = now.getDay();
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((day+6)%7) + offset*7);
  const dates = [];
  for(let i=0;i<7;i++){ const d = new Date(monday); d.setDate(monday.getDate()+i); dates.push(d); }
  return dates;
}
function renderWeekView(){
  const container = document.getElementById('week-view-grid');
  if(!container) return;
  const dates = getWeekDates(weekOffset);
  const todayStr = todayISO();
  const label = document.getElementById('week-view-label');
  if(label){
    const y1=dates[0].getFullYear(), m1=dates[0].getMonth()+1, d1=dates[0].getDate();
    const m2=dates[6].getMonth()+1, d2=dates[6].getDate();
    label.textContent = `${y1}/${m1}/${d1} - ${m2}/${d2}`;
  }
  const weekdayNames = ['一','二','三','四','五','六','日'];
  container.innerHTML = dates.map((d, idx)=>{
    const dateStr = d.toISOString().slice(0,10);
    const isToday = dateStr===todayStr;
    const dayItems = state.schedules
      .filter(sc=>sc.datetime.slice(0,10)===dateStr && sc.status!=='leave' && sc.status!=='cancelled')
      .sort((a,b)=>a.datetime.localeCompare(b.datetime));
    return `<div class="week-day-col ${isToday?'is-today':''}">
      <div class="week-day-head">${d.getMonth()+1}/${d.getDate()}（${weekdayNames[idx]}）</div>
      ${dayItems.length===0 ? '<div class="hint" style="text-align:center;">—</div>' : dayItems.map(sc=>{
        const s = findStudent(sc.studentId);
        return `<div class="week-item ${sc.status==='completed'?'is-done':''}">${fmtTime(sc.datetime)} ${s?s.name:''}</div>`;
      }).join('')}
    </div>`;
  }).join('');
}

function renderScheduleList(){

function exportICS(){
  const now = new Date();
  const upcoming = state.schedules.filter(s=>s.status==='scheduled' && new Date(s.datetime)>=now);
  if(upcoming.length===0){ toast('目前沒有即將到來的排課可匯出'); return; }
  const pad = n => String(n).padStart(2,'0');
  const toICSDate = (iso) => { const d = new Date(iso); return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z'; };
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//CoachOps//Schedule//ZH\r\n';
  upcoming.forEach(sc=>{
    const s = findStudent(sc.studentId);
    const start = new Date(sc.datetime);
    const end = new Date(start.getTime() + (Number(sc.durationMinutes)||60)*60000);
    ics += 'BEGIN:VEVENT\r\nUID:'+sc.id+'@coachops\r\nDTSTAMP:'+toICSDate(new Date().toISOString())+'\r\nDTSTART:'+toICSDate(start.toISOString())+'\r\nDTEND:'+toICSDate(end.toISOString())+'\r\nSUMMARY:訓練課程 - '+(s?s.name:'')+'\r\nDESCRIPTION:'+(sc.note||'').replace(/\n/g,' ')+'\r\nEND:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR\r\n';
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'coachops-schedule.ics'; a.click();
  toast('已匯出 .ics，可在 Google 日曆選擇「匯入」載入此檔案');
}
function requestNotifPermission(){
  if(!('Notification' in window)){ toast('此瀏覽器不支援通知功能'); return; }
  Notification.requestPermission().then(p=>{ toast(p==='granted' ? '通知已開啟' : '未取得通知權限'); });
}
function reminderTick(){
  if(!state.loaded || !('Notification' in window) || Notification.permission!=='granted') return;
  const now = new Date();
  state.schedules.forEach(sc=>{
    if(sc.status!=='scheduled' || sc.notified) return;
    const diffMin = (new Date(sc.datetime) - now)/60000;
    if(diffMin > 0 && diffMin <= 15){
      const s = findStudent(sc.studentId);
      new Notification('即將上課提醒', { body: (s?s.name:'學生')+' 約 '+Math.round(diffMin)+' 分鐘後上課' });
      sc.notified = true;
      saveSchedules();
    }
  });
}

function exportFullBackup(){

    checkins: state.checkins,

    settings: state.settings
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `教練系統備份_${todayISO()}.json`;

async function handleImportBackupFile(e){
  const file = e.target.files[0];
  if(!file) return;
  if(!confirm('匯入備份會覆蓋目前所有資料（學生、購課、簽到、課表、設定），確定要繼續嗎？建議先匯出目前資料做備份再匯入。')){ e.target.value=''; return; }
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.students)){ toast('檔案格式不正確，請確認是本系統匯出的備份檔'); e.target.value=''; return; }
    state.students = data.students || [];
    state.coaches = data.coaches || [];
    state.purchases = data.purchases || [];
    state.checkins = data.checkins || [];
    state.schedules = data.schedules || [];
    state.settings = data.settings || state.settings;
    saveStudents(); saveCoaches(); savePurchases(); saveCheckins(); saveSchedules(); saveSettings();
    toast('已匯入備份，正在重新整理...');
    setTimeout(()=>location.reload(), 1200);
  }catch(err){ toast('匯入失敗，請確認檔案格式是否正確'); }
  e.target.value = '';
}
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(v=>{ const s = String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}

// 報表② 月度簽到與銷課營收明細（回傳陣列，供 Excel 與 CSV 共用）
function buildReport2Rows(start, end){
  const rows = [];
  state.checkins.filter(c=>{ const d=c.timestamp.slice(0,10); return d>=start && d<=end; }).forEach(c=>{
    const s = findStudent(c.studentId); const co = findCoach(c.coachId); const p = findPurchase(c.purchaseId);
    rows.push({ time: c.timestamp, '簽到日期時間': fmtDateTime(c.timestamp), '學生姓名': s?s.name:'', '授課教練': co?co.name:'未指定', '課程方案': p?p.packageName:'', '單堂金額': Math.round(c.unitPrice), '簽到狀態': '已簽到' });
  });
  state.schedules.filter(sc=>(sc.status==='leave'||sc.status==='cancelled') && sc.datetime.slice(0,10)>=start && sc.datetime.slice(0,10)<=end).forEach(sc=>{
    const s = findStudent(sc.studentId); const co = findCoach(sc.coachId);
    rows.push({ time: sc.datetime, '簽到日期時間': fmtDateTime(sc.datetime), '學生姓名': s?s.name:'', '授課教練': co?co.name:'', '課程方案': '', '單堂金額': '', '簽到狀態': sc.status==='leave'?'請假':'取消' });
  });
  rows.sort((a,b)=>a.time.localeCompare(b.time));
  rows.forEach(r=>delete r.time);
  return rows;
}

function exportReport3(){
  const coachId = document.getElementById('payroll-coach').value;

  const coach = findCoach(coachId);
  if(!coach){ toast('請先新增並選擇教練'); return; }
  const monthCheckins = state.checkins.filter(c=>c.coachId===coachId && c.timestamp.slice(0,7)===ym).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
  const dur = Number(state.settings.sessionDurationMinutes)||60;
  const totalHours = Math.round(monthCheckins.length*dur/60*10)/10;

  const totalPayout = monthCheckins.reduce((a,c)=>a+Number(c.commissionAmount||0),0);
  const summary = [{ '教練姓名': coach.name, '結算月份': ym, '簽到總堂數': monthCheckins.length, '總時數': totalHours, '總課程價值': Math.round(totalValue), '抽成比例': coach.defaultCommissionRate+'%', '應付教練鐘點費': Math.round(totalPayout) }];

function bindSettingsHandlers(){

    try{ await firebase.auth().sendPasswordResetEmail(fbUser.email); toast('重設密碼信已寄出，請check信箱'); }
    catch(e){ toast('寄送失敗：'+(e&&e.message?e.message:'')); }
  });

  if(q('#theme-dark-btn')) q('#theme-dark-btn').addEventListener('click', ()=>{ setTheme('dark'); switchTab('settings'); });
  if(q('#btn-add-template')) q('#btn-add-template').addEventListener('click', ()=>{
    const name = document.getElementById('f-tpl-name').value.trim();
    const sessions = Number(document.getElementById('f-tpl-sessions').value);

    if(!name || !sessions || sessions<=0){ toast('請填寫方案名稱與有效堂數'); return; }

    'auth/user-not-found': '找不到這個帳號，請確認 Email 或改用「註冊新帳號」',
    'auth/wrong-password': '密碼錯誤',
    'auth/too-many-requests': '嘗試次數過多，請稍後再試',
    'auth/invalid-credential': 'Email 或密碼錯誤',
  };
  return map[code] || (e && e.message) || '發生錯誤，請再試一次';
}
async function handleAuthSubmit(){
  const email = document.getElementById('auth-email').value.trim();
  const pw = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  if(!email || !pw){ errEl.textContent = '請輸入 Email 與密碼'; return; }
  if(authMode==='register'){
    const pw2 = document.getElementById('auth-password2').value;
    if(pw !== pw2){ errEl.textContent = '兩次密碼輸入不一致'; return; }
    if(pw.length < 6){ errEl.textContent = '密碼至少需要 6 碼'; return; }
    try{ await firebase.auth().createUserWithEmailAndPassword(email, pw); }
    catch(e){ errEl.textContent = mapAuthError(e); }
  } else {
    try{ await firebase.auth().signInWithEmailAndPassword(email, pw); }
    catch(e){ errEl.textContent = mapAuthError(e); }
  }
}
async function handleForgotPassword(){
  const email = document.getElementById('auth-email').value.trim();
  const errEl = document.getElementById('auth-error');
  if(!email){ errEl.textContent = '請先輸入 Email 再點忘記密碼'; return; }
  try{ await firebase.auth().sendPasswordResetEmail(email); toast('重設密碼信已寄出，請check信箱'); }
  catch(e){ errEl.textContent = mapAuthError(e); }
}
async function importLegacyLocalData(){
  const keys = ['students','coaches','purchases','checkins','schedules','settings'];
  const local = {};
  let found = false;
  keys.forEach(k=>{
    try{ const raw = localStorage.getItem(LS_PREFIX+k); if(raw){ local[k] = JSON.parse(raw); found = true; } }catch(e){}
  });
  if(!found){ toast('這台裝置沒有找到舊的本機資料'); return; }
  if(!confirm('偵測到這台裝置有舊的本機資料，是否要匯入到目前登入的帳號？（會覆蓋目前帳號在雲端的資料）')) return;
  try{
    await Promise.all(keys.map(k => local[k] !== undefined ? fbDocRef(k).set({ value: local[k], updatedAt: Date.now() }) : Promise.resolve()));
    toast('已匯入，正在重新整理...');
    setTimeout(()=>location.reload(), 1000);
  }catch(e){ toast('匯入失敗：'+(e&&e.message?e.message:'')); }
}
function doLogout(){
  if(fbReady && firebase.auth().currentUser){
    firebase.auth().signOut();
    return;
  }
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  const pwdEl = document.getElementById('login-pwd');
  if(pwdEl) pwdEl.value = '';
  const errEl = document.getElementById('login-err');
  if(errEl) errEl.textContent = '';
}

/* ---------------- 學生自助查詢連結 ---------------- */
function ensureStudentToken(s){
  if(!s.publicToken){ s.publicToken = genId()+genId()+genId(); }
  return s.publicToken;
}
function buildStudentViewUrl(token){
  return location.origin + location.pathname + '?student=' + token;
}
async function pushPublicView(studentId){
  if(!fbReady || !fbUser) return;
  const s = findStudent(studentId);
  if(!s || !s.publicViewEnabled || !s.publicToken) return;
  const st = studentStats(studentId);
  const upcoming = state.schedules
    .filter(sc => sc.studentId===studentId && sc.status==='scheduled' && new Date(sc.datetime) >= new Date())
    .sort((a,b)=> a.datetime.localeCompare(b.datetime))[0];
  const recentCheckins = state.checkins
    .filter(c => c.studentId===studentId)
    .sort((a,b)=> b.timestamp.localeCompare(a.timestamp))
    .slice(0, 10)
    .map(c => c.timestamp);
  const payload = {
    ownerUid: fbUser.uid,
    name: s.name,
    remaining: st.remaining,
    purchased: st.purchased,
    used: st.used,
    nextClass: upcoming ? upcoming.datetime : null,
    recentCheckins,
    updatedAt: Date.now()
  };
  try{ await firebase.firestore().collection('public_student_view').doc(s.publicToken).set(payload); }
  catch(e){ console.warn('公開檢視同步失敗', e); }
}
async function deletePublicView(studentId){
  const s = findStudent(studentId);
  if(!fbReady || !s || !s.publicToken) return;
  try{ await firebase.firestore().collection('public_student_view').doc(s.publicToken).delete(); }catch(e){}
}
function openStudentLinkModal(studentId){
  if(!fbReady){ toast('此功能需要先設定好雲端同步（Firebase）才能使用'); return; }
  const s = findStudent(studentId);
  if(!s) return;
  if(s.publicViewEnabled && s.publicToken){
    const url = buildStudentViewUrl(s.publicToken);
    openModal(`
      <h3>${s.name} 的自助查詢連結</h3>
      <div class="hint" style="margin-bottom:10px;">學生打開這個連結不用登入，只會看到自己的剩餘堂數、下次上課時間與簽到歷史，看不到其他資料。</div>
      <div class="field"><label>連結網址</label><input type="text" id="student-link-url" value="${url}" readonly></div>
      <button class="btn btn-outline btn-sm" id="btn-copy-link" style="margin-bottom:14px;">複製連結</button>
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
        <div id="student-link-qr" style="padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px;"></div>
        <div class="hint">或讓學生直接掃這個 QR 開啟連結（跟簽到用的 QR 是不同用途）</div>
      </div>
      <div class="modal-actions" style="justify-content:space-between;">
        <button class="btn btn-danger btn-sm" id="btn-disable-link">停用連結</button>
        <button class="btn btn-outline" id="modal-cancel">關閉</button>
      </div>
    `);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('btn-copy-link').addEventListener('click', ()=>{
      const input = document.getElementById('student-link-url');
      input.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(()=>toast('已複製連結')).catch(()=>toast('請手動選取複製'));
      } else { toast('請手動選取複製'); }
    });
    if(typeof QRCode !== 'undefined'){
      new QRCode(document.getElementById('student-link-qr'), { text: url, width:180, height:180, colorDark:'#1A1A1A', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.H });
    }
    document.getElementById('btn-disable-link').addEventListener('click', async ()=>{
      s.publicViewEnabled = false;
      saveStudents();
      await deletePublicView(studentId);
      closeModal();
      toast('已停用連結');
    });
  } else {
    openModal(`
      <h3>${s.name} 的自助查詢連結</h3>
      <div class="hint" style="margin-bottom:14px;">產生後，學生可以透過專屬連結查看自己的剩餘堂數、下次上課時間與簽到歷史，不需要登入帳號。</div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="modal-cancel">取消</button>
        <button class="btn btn-primary" id="btn-enable-link">產生連結</button>
      </div>
    `);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('btn-enable-link').addEventListener('click', async ()=>{
      s.publicViewEnabled = true;
      ensureStudentToken(s);
      saveStudents();
      await pushPublicView(studentId);
      openStudentLinkModal(studentId);
    });
  }
}
/* ---------------- 學生自助查詢頁面（免登入） ---------------- */
async function initStudentView(token){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  const view = document.getElementById('student-view');
  view.style.display = 'flex';
  const logoSrc = document.querySelector('.login-logo')?.getAttribute('src');
  if(logoSrc) document.getElementById('student-view-logo').innerHTML = `<img class="login-logo" src="${logoSrc}" alt="PUPIE S&C STUDIO">`;
  const content = document.getElementById('student-view-content');
  content.innerHTML = '<div class="hint" style="text-align:center;margin-top:20px;">載入中...</div>';
  if(!initFirebaseApp()){
    content.innerHTML = '<div class="hint" style="text-align:center;margin-top:20px;">系統尚未設定完成，請聯絡教練。</div>';
    return;
  }
  try{
    const db = firebase.firestore();
    const ref = db.collection('public_student_view').doc(token);
    const doc = await ref.get();
    if(!doc.exists){
      content.innerHTML = '<div class="hint" style="text-align:center;margin-top:20px;">找不到資料，請確認連結是否正確，或聯絡教練重新產生連結。</div>';
      return;
    }
    renderStudentViewContent(doc.data());
    ref.onSnapshot(snap => { if(snap.exists) renderStudentViewContent(snap.data()); });
  }catch(e){
    content.innerHTML = '<div class="hint" style="text-align:center;margin-top:20px;">載入失敗，請稍後再試。</div>';
  }
}
function renderStudentViewContent(data){
  const content = document.getElementById('student-view-content');
  const remaining = data.remaining;
  const color = remaining<=0 ? 'var(--red)' : (remaining<=2 ? 'var(--amber)' : 'var(--ink)');
  const nextClassText = data.nextClass ? fmtDateTime(data.nextClass) : '目前沒有排定課程';
  const historyHtml = (data.recentCheckins||[]).length===0
    ? '<div class="empty-state">尚無簽到紀錄</div>'
    : data.recentCheckins.map(ts=>`<div class="sched-item"><div class="when">${fmtDateTime(ts)}</div></div>`).join('');
  content.innerHTML = `
    <div class="sub" style="text-align:center;margin-bottom:4px;">${data.name||''} 的課程狀況</div>
    <div style="text-align:center;margin:20px 0;">
      <div class="mono" style="font-size:48px;font-weight:700;color:${color};">${remaining}</div>
      <div class="hint">剩餘堂數</div>
    </div>
    <div class="field"><label>下次上課時間</label><div style="font-size:15px;">${nextClassText}</div></div>
    <div class="field" style="margin-top:16px;"><label>簽到歷史</label></div>
    <div style="max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:2px 12px;">${historyHtml}</div>
    <div class="hint" style="text-align:center;margin-top:16px;">重新整理即可看到最新資料</div>
  `;
}

/* ---------------- 啟動 ---------------- */
async function init(){
  const studentToken = new URLSearchParams(location.search).get('student');
  if(studentToken){
    await initStudentView(studentToken);
    return;
  }
  document.getElementById('btn-logout').addEventListener('click', doLogout);

  const usingFirebase = initFirebaseApp();
  if(usingFirebase){
    renderFirebaseAuthScreen();
    firebase.auth().onAuthStateChanged(async (user)=>{
      if(user){
        fbUser = user;
        fbReady = true;
        await loadAll();
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        state.tab = 'dashboard';
        renderNav();
        renderView();
      } else {
        fbReady = false;
        fbUser = null;
        fbUnsubscribers.forEach(u=>{ try{ u(); }catch(e){} });
        fbUnsubscribers.length = 0;
        state.loaded = false;
        document.getElementById('app').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
      }
    });
  } else {
    renderLegacyLoginScreen();
    await loadAll();
  }
}
init();
